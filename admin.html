<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#202020" />
<title>Admin — Rudra Bhakti Feedback</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css" />
</head>
<body>

<!-- ===== LOGIN ===== -->
<div class="auth-wrap" id="loginWrap">
    <div class="auth-card">
        <div class="auth-brand">
            <div class="logo" aria-hidden="true">ॐ</div>
            <div class="brand">Admin Panel</div>
            <div class="subtitle">Rudra Bhakti · Reel Feedback</div>
        </div>

        <form id="loginForm" class="auth-form" novalidate>
            <div class="field">
                <label for="loginEmail">Email</label>
                <input type="email" id="loginEmail" placeholder="admin@rudrabhakti.com" autocomplete="email" />
            </div>
            <div class="field">
                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" placeholder="Enter password" autocomplete="current-password" />
            </div>

            <p class="form-error" id="loginError" role="alert"></p>

            <button type="submit" class="btn btn-primary">
                <span id="loginLabel">Sign In</span>
            </button>

            <button type="button" class="link-btn" id="forgotLink">Forgot password?</button>
        </form>

        <p class="auth-note">Phase 1 preview — sign in with any demo credentials.</p>
    </div>
</div>

<!-- ===== FORGOT ===== -->
<div class="auth-wrap" id="forgotWrap" hidden>
    <div class="auth-card">
        <div class="auth-brand">
            <div class="logo" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2"/>
                    <path d="M7 11V7a5 5 0 0110 0v4"/>
                </svg>
            </div>
            <div class="brand">Reset Password</div>
            <div class="subtitle">Enter your admin email</div>
        </div>

        <form id="forgotForm" class="auth-form" novalidate>
            <div class="field">
                <label for="forgotEmail">Email</label>
                <input type="email" id="forgotEmail" placeholder="admin@rudrabhakti.com" autocomplete="email" />
            </div>

            <p class="form-error" id="forgotError"></p>
            <p class="form-success" id="forgotSuccess"></p>

            <button type="submit" class="btn btn-primary">
                <span id="forgotLabel">Send Reset Link</span>
            </button>

            <button type="button" class="link-btn" id="forgotBack">Back to Sign In</button>
        </form>
    </div>
</div>

<!-- ===== DASHBOARD ===== -->
<div class="dash" id="dash" hidden>

    <header class="dash-header">
        <div class="dash-header-inner">
            <div class="brand-block">
                <div class="logo logo--sm" aria-hidden="true">ॐ</div>
                <div class="brand-text">
                    <strong>Admin</strong>
                    <small>Reel Feedback</small>
                </div>
            </div>
            <div class="dash-user">
                <span class="dash-user-email" id="dashUserEmail">admin@rudrabhakti.com</span>
                <button type="button" class="btn-logout" id="logoutBtn">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M9 21H5a2 2 0 01-2-2V5a2 2 0 012-2h4M16 17l5-5-5-5M21 12H9"/>
                    </svg>
                    <span>Logout</span>
                </button>
            </div>
        </div>
    </header>

    <main class="dash-main">

        <section class="stats">
            <div class="stat">
                <div class="stat-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z"/>
                    </svg>
                </div>
                <div class="stat-body">
                    <span class="stat-label">Total Feedback</span>
                    <span class="stat-value" id="statTotal">0</span>
                </div>
            </div>

            <div class="stat">
                <div class="stat-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="m12 2 3 6.5 7 1-5 4.9 1.2 7L12 18l-6.2 3.4L7 14.4 2 9.5l7-1z"/>
                    </svg>
                </div>
                <div class="stat-body">
                    <span class="stat-label">Average Rating</span>
                    <span class="stat-value" id="statAvg">0.0</span>
                </div>
            </div>

            <div class="stat">
                <div class="stat-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"/>
                    </svg>
                </div>
                <div class="stat-body">
                    <span class="stat-label">5-Rating Count</span>
                    <span class="stat-value" id="statFive">0</span>
                </div>
            </div>

            <div class="stat">
                <div class="stat-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M12 6v6l4 2"/>
                    </svg>
                </div>
                <div class="stat-body">
                    <span class="stat-label">Today's Feedback</span>
                    <span class="stat-value" id="statToday">0</span>
                </div>
            </div>
        </section>

        <section class="toolbar">
            <div class="search">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"/>
                    <path d="M21 21l-4.35-4.35"/>
                </svg>
                <input type="search" id="searchInput" placeholder="Search by name, email, or message…" />
            </div>

            <select id="filterRating" class="select">
                <option value="all">All Ratings</option>
                <option value="5">5 only</option>
                <option value="4">4 only</option>
                <option value="3">3 only</option>
                <option value="2">2 only</option>
                <option value="1">1 only</option>
                <option value="4plus">4 and above</option>
            </select>

            <select id="filterDate" class="select">
                <option value="all">All Time</option>
                <option value="today">Today</option>
                <option value="7d">Last 7 days</option>
                <option value="30d">Last 30 days</option>
            </select>

            <select id="sortBy" class="select">
                <option value="newest">Newest first</option>
                <option value="oldest">Oldest first</option>
                <option value="highest">Highest rating</option>
                <option value="lowest">Lowest rating</option>
            </select>
        </section>

        <section class="list-wrap">
            <div class="list-head">
                <span id="resultCount">0 results</span>
            </div>
            <div class="list" id="feedbackList"></div>
        </section>

    </main>
</div>

<script src="admin.js"></script>
</body>
</html>
